<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>What If You Had Invested in NIFTY 50? | StockMath</title>
  <meta name="description" content="See how much your investment in NIFTY 50 would be worth today if you invested on any past date. Simulate returns, profit and growth across all NIFTY 50 stocks." />
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.stockmath.co.in/nifty50-calculator/">

  <link rel="icon" href="/favicon.ico">

  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; color:#222; }
    header { background:#111; color:#fff; padding:20px; text-align:center; }
    main { max-width:1100px; margin:30px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    h1 { text-align:center; }
    .controls { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
    input, button { padding:10px; font-size:16px; }
    button { background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    button:disabled { background:#999; cursor:not-allowed; }

    .summary { display:flex; justify-content:space-around; flex-wrap:wrap; background:#f0f8ff; padding:15px; border-radius:6px; margin:20px 0; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { border:1px solid #ddd; padding:8px; text-align:right; }
    th { background:#f1f1f1; }
    th:first-child, td:first-child { text-align:left; }

    .positive { color:green; font-weight:bold; }
    .negative { color:red; font-weight:bold; }

    /* LOADER */
    #loader {
      display:none;
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      background:rgba(255,255,255,0.85);
      z-index:9999;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      font-size:18px;
    }
    .spinner {
      width:50px; height:50px;
      border:5px solid #ddd;
      border-top:5px solid #007bff;
      border-radius:50%;
      animation: spin 1s linear infinite;
      margin-bottom:15px;
    }
    @keyframes spin { from {transform:rotate(0)} to {transform:rotate(360deg)} }
  </style>
</head>

<body>

<div id="loader">
  <div class="spinner"></div>
  <div>Calculating NIFTY 50 returns... Please wait</div>
</div>

<header>
  <h2>StockMath</h2>
  <p>Long Term Investment Simulators</p>
</header>

<main>

<h1>What If You Had Invested in NIFTY 50?</h1>

<div class="controls">
  <input type="date" id="investDate">
  <input type="date" id="targetDate">
  <input type="number" id="shares" value="1" min="1">
  <button id="calcBtn" onclick="runCalculation()">Show My Returns</button>
</div>

<div class="summary" id="summary" style="display:none;">
  <div><strong>Total Investment:</strong> ₹<span id="sumInvest">0</span></div>
  <div><strong>Current Value:</strong> ₹<span id="sumCurrent">0</span></div>
  <div><strong>Total P/L:</strong> ₹<span id="sumPL">0</span></div>
  <div><strong>Return:</strong> <span id="sumReturn">0</span>%</div>
</div>

<div style="overflow-x:auto;">
  <table id="resultTable" style="display:none;">
    <thead>
      <tr>
        <th>Company</th><th>Buy Date</th><th>Buy Price</th><th>Sell Date</th><th>Sell Price</th>
        <th>Shares</th><th>Investment</th><th>Current Value</th><th>P/L</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

</main>

<script>
async function loadJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Failed to load " + url);
  return res.json();
}

function findPriceOnOrBefore(targetDate, pricesObj) {
  const dates = Object.keys(pricesObj).sort();
  for (let i = dates.length - 1; i >= 0; i--) {
    if (dates[i] <= targetDate) {
      return { date: dates[i], price: pricesObj[dates[i]] };
    }
  }
  return null;
}

function mergePrices(history, current) {
  return { ...history.prices, ...current };
}

async function runCalculation() {
  const investDate = document.getElementById("investDate").value;
  const targetDateInput = document.getElementById("targetDate").value;
  const shares = parseInt(document.getElementById("shares").value || "1", 10);

  if (!investDate) {
    alert("Please select investment date");
    return;
  }

  document.getElementById("loader").style.display = "flex";
  document.getElementById("calcBtn").disabled = true;

  const symbols = await loadJSON("/data/nifty50.json");

  let totalInvestment = 0;
  let totalCurrent = 0;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  for (const sym of symbols) {
    try {
      const history = await loadJSON(`/data/${sym}_history.json`);
      const current = await loadJSON(`/data/${sym}_current.json`);

      const merged = mergePrices(history, current);

      const buy = findPriceOnOrBefore(investDate, merged);
      if (!buy) continue;

      let sell;
      if (targetDateInput) {
        sell = findPriceOnOrBefore(targetDateInput, merged);
      } else {
        const latestDate = Object.keys(merged).sort().pop();
        sell = { date: latestDate, price: merged[latestDate] };
      }

      if (!sell) continue;

      const investment = buy.price * shares;
      const currentValue = sell.price * shares;
      const pl = currentValue - investment;

      totalInvestment += investment;
      totalCurrent += currentValue;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${sym}</td>
        <td>${buy.date}</td>
        <td>${buy.price.toFixed(2)}</td>
        <td>${sell.date}</td>
        <td>${sell.price.toFixed(2)}</td>
        <td>${shares}</td>
        <td>${investment.toFixed(2)}</td>
        <td>${currentValue.toFixed(2)}</td>
        <td class="${pl >= 0 ? "positive" : "negative"}">${pl.toFixed(2)}</td>
      `;
      tbody.appendChild(tr);
    } catch(e) {
      console.warn("Skipping", sym, e);
    }
  }

  const totalPL = totalCurrent - totalInvestment;
  const ret = (totalPL / totalInvestment) * 100;

  document.getElementById("sumInvest").innerText = totalInvestment.toFixed(2);
  document.getElementById("sumCurrent").innerText = totalCurrent.toFixed(2);
  document.getElementById("sumPL").innerText = totalPL.toFixed(2);
  document.getElementById("sumReturn").innerText = ret.toFixed(2);

  document.getElementById("summary").style.display = "flex";
  document.getElementById("resultTable").style.display = "table";

  document.getElementById("loader").style.display = "none";
  document.getElementById("calcBtn").disabled = false;
}
</script>

</body>
</html>
