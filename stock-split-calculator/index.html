  <input type="number" id="price" placeholder="Current Share Price (₹)">
  <input type="number" id="qty" placeholder="Current Quantity">
  <input type="number" id="ratio" placeholder="Split Ratio (e.g. 2 for 1:2)">

  <button onclick="calcSplit()">Calculate</button>

  <div class="result" id="output"></div>

<script>
function calcSplit() {
  const p = parseFloat(document.getElementById("price").value) || 0;
  const q = parseFloat(document.getElementById("qty").value) || 0;
  const r = parseFloat(document.getElementById("ratio").value) || 0;

  const output = document.getElementById("output");

  if (p <= 0 || q <= 0 || r <= 0) {
    output.innerHTML = "Please enter valid values.";
    return;
  }

  const newPrice = (p / r).toFixed(2);
  const newQty = q * r;

  output.innerHTML = `
    <strong>New Share Price:</strong> ₹${newPrice}<br>
    <strong>New Quantity:</strong> ${newQty}
  `;
}
</script>
